[package]
name = "dwiki"
version = "2026.3.1"
edition = "2021"
rust-version = "1.99"
description = "Unofficial CLI for the DeepWiki MCP server — query repository documentation from your terminal or coding agent"
license = "MIT"
repository = "https://github.com/f4ah6o/deepwiki-mcp-cli-rs"
keywords = ["mcp", "deepwiki", "cli", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "dwiki"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
